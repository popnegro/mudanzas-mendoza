<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mudanzas en Mendoza | Buscador de Cobertura Completo</title>
    <meta name="description" content="Servicio de mudanzas y fletes en los 18 departamentos de Mendoza. Consultá cobertura por distrito y pedí tu presupuesto online.">
    
    <style>
        :root {
            --mendoza-wine: #630d16;
            --truck-blue: #1a4a7c;
            --whatsapp: #25d366;
            --bg: #f8f9fa;
        }

        body { font-family: 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: #333; margin: 0; padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; }
        
        header { text-align: center; padding: 40px 0; background: white; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 30px; }
        header h1 { color: var(--mendoza-wine); margin: 0; font-size: 2rem; }
        header p { color: #666; margin-top: 10px; }

        /* Buscador Sticky */
        .search-box { position: sticky; top: 15px; z-index: 1000; margin-bottom: 30px; }
        #searchInput {
            width: 100%;
            padding: 20px 30px;
            font-size: 1.2rem;
            border: none;
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            outline: none;
            transition: 0.3s;
        }
        #searchInput:focus { box-shadow: 0 10px 30px rgba(99, 13, 22, 0.2); }

        /* Grid de Departamentos */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        
        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            border-left: 6px solid var(--mendoza-wine);
            display: flex;
            flex-direction: column;
            transition: 0.3s;
        }
        .card:hover { transform: translateY(-5px); box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
        .card h2 { margin: 0; color: var(--truck-blue); font-size: 1.4rem; }
        
        .distritos-label { font-size: 0.8rem; font-weight: bold; color: #999; margin-top: 15px; text-transform: uppercase; }
        .distritos-list { font-size: 0.95rem; color: #555; margin-bottom: 20px; line-height: 1.4; }

        .btn-group { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }
        .btn {
            text-decoration: none;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            font-size: 0.9rem;
            transition: 0.3s;
        }
        .btn-ws { background: var(--whatsapp); color: white; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-ws:hover { background: #1eb954; }
        .btn-map { background: #eee; color: #555; }
        .btn-map:hover { background: #ddd; }

        .no-results { grid-column: 1 / -1; text-align: center; padding: 50px; color: #888; }

        @media (max-width: 600px) {
            header h1 { font-size: 1.5rem; }
            #searchInput { padding: 15px 20px; font-size: 1rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Cobertura Mudanzas Mendoza</h1>
        <p>Seleccioná tu ubicación para recibir un presupuesto inmediato.</p>
    </header>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Escribí tu distrito (ej: Vistalba, Palmira, Bowen...)" onkeyup="filter()">
    </div>

    <div id="grid" class="grid"></div>
</div>

<script>
    // REEMPLAZAR CON TU TELÉFONO (Sin el +)
    const WHATSAPP_NUMBER = "5492610000000"; 

    const mendozaData = [
        { depto: "Capital", distritos: ["Centro", "1ra a 6ta Sección", "La Favorita", "San Agustín"] },
        { depto: "Godoy Cruz", distritos: ["Sarmiento", "Las Tortugas", "San Francisco del Monte", "Villa Hipódromo"] },
        { depto: "Guaymallén", distritos: ["Villa Nueva", "Dorrego", "Las Cañas", "San José", "Belgrano", "El Bermejo", "Los Corralitos", "Rodeo de la Cruz"] },
        { depto: "Luján de Cuyo", distritos: ["Chacras de Coria", "Vistalba", "Mayor Drummond", "Carrodilla", "Potrerillos", "Ugarteche", "Agrelo"] },
        { depto: "Maipú", distritos: ["Ciudad", "Coquimbito", "Luzuriaga", "Fray Luis Beltrán", "Rodeo del Medio", "Gutiérrez", "Lunlunta"] },
        { depto: "Las Heras", distritos: ["Ciudad", "El Challao", "Panquehua", "El Plumerillo", "Uspallata", "Sierras de Encalada"] },
        { depto: "San Rafael", distritos: ["Ciudad", "Rama Caída", "Las Paredes", "Cuadro Nacional", "Villa Atuel", "El Nihuil", "Monte Comán"] },
        { depto: "San Martín", distritos: ["Ciudad", "Palmira", "Chapanay", "Montecaseros", "Tres Porteñas", "Alto Verde"] },
        { depto: "Tunuyán", distritos: ["Ciudad", "Vista Flores", "Colonia Las Rosas", "Los Árboles", "Villa Seca"] },
        { depto: "San Carlos", distritos: ["La Consulta", "Eugenio Bustos", "Villa San Carlos", "Pareditas"] },
        { depto: "Tupungato", distritos: ["Ciudad", "Gualtallary", "Cordón del Plata", "San José", "La Carrera"] },
        { depto: "Rivadavia", distritos: ["Ciudad", "Medrano", "La Libertad", "Reducción", "Andrade"] },
        { depto: "Junín", distritos: ["La Colonia", "Ciudad", "Algarrobo Grande", "Philipps", "Orfila"] },
        { depto: "Lavalle", distritos: ["Villa Tulumaya", "Costa de Araujo", "Gustavo André", "Jocolí", "Tres de Mayo"] },
        { depto: "General Alvear", distritos: ["Ciudad", "Bowen", "San Pedro del Atuel", "Alvear Oeste"] },
        { depto: "Malargüe", distritos: ["Ciudad", "Las Leñas", "Agua Escondida", "Río Grande", "Río Barrancas"] },
        { depto: "Santa Rosa", distritos: ["Villa Cabecera", "Las Catitas", "La Dormida", "12 de Octubre"] },
        { depto: "La Paz", distritos: ["Villa Antigua", "Ciudad", "Las Chacritas", "Desaguadero"] }
    ];

    function filter() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const grid = document.getElementById('grid');
        grid.innerHTML = '';

        const results = mendozaData.filter(item => 
            item.depto.toLowerCase().includes(query) || 
            item.distritos.some(d => d.toLowerCase().includes(query))
        );

        if (results.length === 0) {
            grid.innerHTML = `<div class="no-results"><h3>Sin resultados para "${query}"</h3><p>Consultanos por WhatsApp para traslados a zonas especiales.</p></div>`;
            return;
        }

        results.forEach(item => {
            const card = document.createElement('article');
            card.className = 'card';
            
            const wsMsg = encodeURIComponent(`Hola, quisiera consultar presupuesto para una mudanza en ${item.depto}. ¿Tienen disponibilidad?`);
            
            card.innerHTML = `
                <h2>📍 ${item.depto}</h2>
                <div class="distritos-label">Distritos cubiertos</div>
                <div class="distritos-list">${item.distritos.join(' • ')}</div>
                <div class="btn-group">
                    <a href="https://wa.me/${WHATSAPP_NUMBER}?text=${wsMsg}" target="_blank" class="btn btn-ws">
                        Presupuesto por WhatsApp
                    </a>
                    <a href="https://www.google.com/maps/search/Maipu+Mendoza2{item.depto}+Mendoza" target="_blank" class="btn btn-map">
                        Ver ruta de traslado
                    </a>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    // Inicialización
    filter();
</script>

</body>
</html>
