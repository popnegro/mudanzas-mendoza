name: Reusable Browser QA

on:
  workflow_call:
    inputs:
      preview_url:
        description: Public preview URL to smoke-test
        required: true
        type: string
      node_version:
        required: false
        default: '24'
        type: string
      desktop_width:
        required: false
        default: 1440
        type: number
      desktop_height:
        required: false
        default: 900
        type: number
      mobile_width:
        required: false
        default: 390
        type: number
      mobile_height:
        required: false
        default: 844
        type: number
    secrets:
      VERCEL_AUTOMATION_BYPASS_SECRET:
        required: true

jobs:
  browser:
    name: Browser technical QA (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode:
          - desktop
          - routes
          - mobile
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}

      - name: Install Chrome and agent-browser
        run: npx --yes agent-browser@0.37.1 install --with-deps

      - name: Desktop runtime gate
        if: matrix.mode == 'desktop'
        env:
          QA_URL: ${{ inputs.preview_url }}
          QA_WIDTH: ${{ inputs.desktop_width }}
          QA_HEIGHT: ${{ inputs.desktop_height }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          BYPASS_URL="${QA_URL}?x-vercel-set-bypass-cookie=true&x-vercel-protection-bypass=${VERCEL_AUTOMATION_BYPASS_SECRET}"
          npx --yes agent-browser@0.37.1 open "$BYPASS_URL"
          npx --yes agent-browser@0.37.1 set viewport "$QA_WIDTH" "$QA_HEIGHT"
          npx --yes agent-browser@0.37.1 wait --load networkidle
          npx --yes agent-browser@0.37.1 eval '(() => {
            const bodyText = document.body.innerText.trim();
            const root = document.querySelector("#root");
            const overlay = document.querySelector("[data-nextjs-dialog], .vite-error-overlay, #webpack-dev-server-client-overlay");
            const images = [...document.images].filter(img => !img.complete || img.naturalWidth === 0);
            if (!document.title) throw new Error("Missing document title");
            if (!root || root.children.length === 0) throw new Error("React root is empty");
            if (bodyText.length < 80) throw new Error("Page appears blank or has insufficient rendered content");
            if (overlay) throw new Error("Framework error overlay detected");
            if (images.length) throw new Error("Broken/unloaded images: " + images.map(i => i.src).join(", "));
            if (document.body.scrollWidth > window.innerWidth + 1) throw new Error(`Horizontal overflow: ${document.body.scrollWidth} > ${window.innerWidth}`);
            return JSON.stringify({title:document.title,contentChars:bodyText.length,images:document.images.length,width:window.innerWidth,height:window.innerHeight});
          })()'
          npx --yes agent-browser@0.37.1 errors
          npx --yes agent-browser@0.37.1 screenshot "$RUNNER_TEMP/desktop.png"

      - name: Critical route gate
        if: matrix.mode == 'routes'
        env:
          QA_URL: ${{ inputs.preview_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          for ROUTE in "/" "/destinos" "/blog"; do
            BYPASS_URL="${QA_URL%/}${ROUTE}?x-vercel-set-bypass-cookie=true&x-vercel-protection-bypass=${VERCEL_AUTOMATION_BYPASS_SECRET}"
            npx --yes agent-browser@0.37.1 open "$BYPASS_URL"
            npx --yes agent-browser@0.37.1 wait --load networkidle
            npx --yes agent-browser@0.37.1 eval '(() => {
              const text=document.body.innerText.trim();
              const root=document.querySelector("#root");
              const overlay=document.querySelector("[data-nextjs-dialog], .vite-error-overlay, #webpack-dev-server-client-overlay");
              if (!root || root.children.length===0) throw new Error("Empty React root on " + location.pathname);
              if (text.length < 80) throw new Error("Insufficient content on " + location.pathname);
              if (overlay) throw new Error("Framework error overlay on " + location.pathname);
              return JSON.stringify({path:location.pathname,title:document.title,contentChars:text.length});
            })()'
            npx --yes agent-browser@0.37.1 errors
          done

      - name: Mobile interaction gate
        if: matrix.mode == 'mobile'
        env:
          QA_URL: ${{ inputs.preview_url }}
          QA_WIDTH: ${{ inputs.mobile_width }}
          QA_HEIGHT: ${{ inputs.mobile_height }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          BYPASS_URL="${QA_URL}?x-vercel-set-bypass-cookie=true&x-vercel-protection-bypass=${VERCEL_AUTOMATION_BYPASS_SECRET}"
          npx --yes agent-browser@0.37.1 set viewport "$QA_WIDTH" "$QA_HEIGHT"
          npx --yes agent-browser@0.37.1 open "$BYPASS_URL"
          npx --yes agent-browser@0.37.1 set viewport "$QA_WIDTH" "$QA_HEIGHT"
          npx --yes agent-browser@0.37.1 wait --load networkidle
          npx --yes agent-browser@0.37.1 eval '(() => {
            const width=window.innerWidth;
            if (!window.matchMedia("(max-width: 1023px)").matches) throw new Error(`Mobile viewport not active: ${width}px`);
            if (!document.querySelector("[aria-label=\"Toggle Menu\"]")) throw new Error("Mobile menu toggle not found");
            return JSON.stringify({width,height:window.innerHeight});
          })()'
          npx --yes agent-browser@0.37.1 find role button click --name "Toggle Menu"
          npx --yes agent-browser@0.37.1 wait 1000
          npx --yes agent-browser@0.37.1 eval '(() => {
            const panel=[...document.querySelectorAll("div")].find(el => getComputedStyle(el).position==="fixed" && getComputedStyle(el).overflowY==="auto");
            const bodyLocked=getComputedStyle(document.body).overflow==="hidden";
            const menuText=document.body.innerText.includes("Nuestros Destinos");
            if (!panel) throw new Error("Mobile menu panel not found");
            if (!bodyLocked) throw new Error("Body scroll is not locked while mobile menu is open");
            if (!menuText) throw new Error("Nuestros Destinos link is missing from mobile menu");
            if (panel.clientHeight >= panel.scrollHeight && panel.scrollHeight > window.innerHeight) throw new Error("Mobile menu overflow model is invalid");
            return JSON.stringify({panelFound:true,bodyLocked,menuText,panelScrollHeight:panel.scrollHeight,panelClientHeight:panel.clientHeight});
          })()'
          npx --yes agent-browser@0.37.1 screenshot "$RUNNER_TEMP/mobile-menu.png"
          npx --yes agent-browser@0.37.1 press Escape
          npx --yes agent-browser@0.37.1 errors

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa-evidence-${{ matrix.mode }}
          path: ${{ runner.temp }}/*.png
          if-no-files-found: ignore
