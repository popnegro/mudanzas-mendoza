name: Phase 2 finalize

on:
  push:
    branches:
      - feature/new-web

permissions:
  contents: write

jobs:
  finalize:
    if: "!contains(github.event.head_commit.message, 'Phase 2: finalize branch')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/new-web
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: static/package-lock.json
      - name: Repair homepage JSX if needed
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('static/src/App.tsx')
          s = p.read_text(encoding='utf-8')
          marker = '{/* Right Column: Preloaded hero visual with aspect ratio */}'
          pos = s.find(marker)
          if pos < 0:
              raise SystemExit('Right Column marker not found')
          prefix = s[max(0, pos-120):pos]
          if '</div>' not in prefix:
              indent = re.match(r'(?m)^\s*', s[pos:]).group(0)
              s = s[:pos] + f'{indent}</div>\n\n' + s[pos:]
              p.write_text(s, encoding='utf-8')
          PY
      - name: Synchronize Node typings and lockfile
        working-directory: static
        run: npm install --save-dev @types/node@^22.10.2 --no-audit --no-fund
      - name: Build and typecheck
        working-directory: static
        run: |
          npm run build
          npx tsc --noEmit
      - name: Verify Phase 2 invariants
        working-directory: static
        run: |
          if grep -RInE '4\.9/?5|4\.9.*186|reviewCount.*186|ratingValue.*4\.9' src; then exit 1; fi
          if grep -RIn 'mudanzasmiranda.com.ar' src index.html public; then exit 1; fi
          grep -RIn 'Contactar por WhatsApp' src/App.tsx
          grep -RIn 'handleWhatsAppRedirect' src/components/QuoteForm.tsx
          grep -RIn 'mudanzasmendoza.com.ar' src/components/SEO.tsx src/App.tsx
      - name: Commit final state and remove temporary workflows
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/src/App.tsx static/package.json static/package-lock.json static/tsconfig.json
          git commit -m 'Phase 2: finalize branch' || true
          git rm .github/workflows/phase2-finalize.yml .github/workflows/phase2-validate-final.yml || true
          git commit -m 'chore(phase2): remove temporary validation workflows' || true
          git push origin feature/new-web
