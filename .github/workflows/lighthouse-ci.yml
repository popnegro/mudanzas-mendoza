name: Lighthouse CI

on:
  push:
    branches:
      - theme-mudanzas
  workflow_dispatch:
    inputs:
      url:
        description: 'Vercel Preview URL to audit'
        required: true
        default: 'https://mudanzas-mendoza-oqdxsc3cy-popnegros-projects.vercel.app'
        type: string

jobs:
  lighthouse:
    name: Lighthouse baseline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Lighthouse CI against Vercel Preview
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            ${{ inputs.url || 'https://mudanzas-mendoza-oqdxsc3cy-popnegros-projects.vercel.app' }}
          configPath: ./lighthouserc.cjs
          uploadArtifacts: true
          temporaryPublicStorage: true
