name: Lighthouse CI

on:
  push:
    branches:
      - theme-mudanzas
  pull_request:
    branches:
      - theme-mudanzas
  workflow_dispatch:
    inputs:
      url:
        description: 'Vercel branch Preview URL to audit'
        required: true
        default: 'https://mudanzas-mendoza-git-theme-mudanzas-popnegros-projects.vercel.app'
        type: string

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    uses: ./.github/workflows/reusable-lighthouse.yml
    with:
      preview_url: ${{ inputs.url || 'https://mudanzas-mendoza-git-theme-mudanzas-popnegros-projects.vercel.app' }}
      runs: 3
      performance_min: 0.70
      accessibility_min: 0.90
      best_practices_min: 0.90
      # Vercel Preview sends x-robots-tag: noindex; crawlability is verified on production.
      seo_min: 0.65
