name: Phase 2 report fix

on:
  push:
    branches:
      - feature/new-web

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, 'Phase 2: report synchronized')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/new-web
          fetch-depth: 0
      - name: Synchronize report
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('static/SEO-MENDOZAMUDANZAS-COMMERCIAL-AUTHORITY-PHASE-2.md')
          s = p.read_text(encoding='utf-8')
          old = '**Estado:** BLOQUEADA — no cerrar Fase 2 ni abrir PR de merge a `main` todavía.'
          new = '**Estado:** IMPLEMENTADA — validación técnica final OK. PR/merge a `main` quedan pendientes de revisión humana final.'
          if old not in s:
              raise SystemExit('Expected blocked status not found')
          s = s.replace(old, new, 1)
          if '## Cierre de implementación — 2026-09-12' not in s:
              s += '''\n\n## Cierre de implementación — 2026-09-12\n\n- WhatsApp definido como conversión principal.\n- Home: `Contactar por WhatsApp` como CTA primario y `Solicitar presupuesto` como CTA secundario.\n- QuoteForm deriva los datos estructurados a WhatsApp y no afirma persistencia en base de datos.\n- Eliminado el rating no verificado `4.9 / 186` de UI y Schema.\n- Dominio normalizado a `https://mudanzasmendoza.com.ar`.\n- `npm run build` OK.\n- `npx tsc --noEmit` OK después de corregir `ignoreDeprecations` y agregar `@types/node`.\n- No se realizó merge a `main`.\n'''
          p.write_text(s, encoding='utf-8')
          PY
          grep -q 'IMPLEMENTADA — validación técnica final OK' static/SEO-MENDOZAMUDANZAS-COMMERCIAL-AUTHORITY-PHASE-2.md
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/SEO-MENDOZAMUDANZAS-COMMERCIAL-AUTHORITY-PHASE-2.md
          git commit -m 'Phase 2: report synchronized'
          git rm .github/workflows/phase2-doc-fix.yml
          git commit -m 'chore(phase2): remove report workflow'
          git push origin feature/new-web
