name: Phase 2 JSX repair

on:
  push:
    branches:
      - feature/new-web

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, 'Phase 2: remove JSX repair workflow')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/new-web
          fetch-depth: 0
      - name: Repair App.tsx
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('static/src/App.tsx')
          s = p.read_text(encoding='utf-8')
          needle = '''                            Solicitar presupuesto\n                            <ArrowRight className="w-5 h-5" />\n                          </a>\n                        \n                      {/* Right Column: Preloaded hero visual with aspect ratio */}'''
          replacement = '''                            Solicitar presupuesto\n                            <ArrowRight className="w-5 h-5" />\n                          </a>\n                        </div>\n\n                      {/* Right Column: Preloaded hero visual with aspect ratio */}'''
          if needle not in s:
              raise SystemExit('Expected homepage CTA/Right Column boundary not found')
          p.write_text(s.replace(needle, replacement, 1), encoding='utf-8')
          PY
      - name: Verify source
        run: |
          grep -RInE '4\.9/?5|4\.9.*186|reviewCount.*186|ratingValue.*4\.9' static/src && exit 1 || true
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/src/App.tsx
          git commit -m 'Phase 2: repair homepage JSX' || true
          git rm .github/workflows/phase2-fix-jsx.yml
          git commit -m 'Phase 2: remove JSX repair workflow'
          git push origin feature/new-web
