name: Phase 2 final close

on:
  push:
    branches:
      - feature/new-web

permissions:
  contents: write

jobs:
  close:
    if: "!contains(github.event.head_commit.message, 'Phase 2: close final state')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/new-web
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: static/package-lock.json
      - name: Close homepage left column
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('static/src/App.tsx')
          s = p.read_text(encoding='utf-8')
          marker = '                      {/* Right Column: Preloaded hero visual with aspect ratio */}'
          pos = s.find(marker)
          if pos < 0:
              raise SystemExit('Right Column marker not found')
          before = s[max(0, pos-180):pos]
          if before.count('</div>') < 2:
              insert_at = pos
              s = s[:insert_at] + '                        </div>\n' + s[insert_at:]
              p.write_text(s, encoding='utf-8')
          PY
      - name: Build and typecheck
        working-directory: static
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npx tsc --noEmit
      - name: Verify invariants
        working-directory: static
        run: |
          if grep -RInE '4\.9/?5|4\.9.*186|reviewCount.*186|ratingValue.*4\.9' src; then exit 1; fi
          if grep -RIn 'mudanzasmiranda.com.ar' src index.html public; then exit 1; fi
          grep -RIn 'Contactar por WhatsApp' src/App.tsx
          grep -RIn 'handleWhatsAppRedirect' src/components/QuoteForm.tsx
      - name: Commit and remove temporary workflows
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/src/App.tsx static/package.json static/package-lock.json static/tsconfig.json
          git commit -m 'Phase 2: close final state' || true
          git rm .github/workflows/phase2-close.yml .github/workflows/phase2-finalize.yml .github/workflows/phase2-validate-final.yml || true
          git commit -m 'chore(phase2): remove temporary workflows' || true
          git push origin feature/new-web
