name: Theme Mudanzas QA

on:
  push:
    branches:
      - theme-mudanzas
  pull_request:
    branches:
      - theme-mudanzas

jobs:
  qa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: static/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  browser:
    name: Browser visual and interaction QA
    needs: qa
    uses: ./.github/workflows/reusable-browser-qa.yml
    secrets: inherit
    with:
      preview_url: https://mudanzas-mendoza-git-theme-mudanzas-popnegros-projects.vercel.app
      node_version: '22'
      desktop_width: 1440
      desktop_height: 900
      mobile_width: 390
      mobile_height: 844
