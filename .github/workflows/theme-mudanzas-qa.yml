name: Theme Mudanzas QA

on:
  push:
    branches:
      - theme-mudanzas
  pull_request:
    branches:
      - theme-mudanzas

jobs:
  qa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: static/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
