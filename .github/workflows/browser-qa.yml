name: Browser QA

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      url:
        description: Public URL to audit
        required: true
        default: 'https://mudanzasmendoza.com.ar'
        type: string

concurrency:
  group: browser-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    uses: ./.github/workflows/reusable-browser-qa.yml
    with:
      preview_url: ${{ inputs.url || 'https://mudanzasmendoza.com.ar' }}
